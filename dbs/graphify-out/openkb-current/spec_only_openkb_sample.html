  <script>
    const pages = [{"id": "index", "kind": "Index", "title": "OpenKB Index", "html": "<h1>spec-only Knowledge Base</h1>\n<h2>Documents</h2>\n<ul>\n<li><a href=\"#summaries/0005_licensing_d3fe8b66d2\">0005_licensing_d3fe8b66d2</a> (short) — Ibex licensing terms and contribution guidance under Apache 2.0.</li>\n<li><a href=\"#summaries/0004_index_3411d17b96\">0004_index_3411d17b96</a> (short) — Overview of Ibex as a configurable, verified open-source RISC-V CPU core.</li>\n<li><a href=\"#summaries/0003_compliance_32f20a4d58\">0003_compliance_32f20a4d58</a> (short) — Ibex’s supported RISC-V specs, ISA variants, and optional extensions.</li>\n<li><a href=\"#summaries/0002_requirements_e3923399fe\">0002_requirements_e3923399fe</a> (short) — Lists Python packages required to build the ibex documentation.</li>\n<li><a href=\"#summaries/0001_index_bd80d85a59\">0001_index_bd80d85a59</a> (short) — Introductory index for the Ibex RISC-V CPU core documentation set.</li>\n</ul>\n<h2>Concepts</h2>\n<ul>\n<li><a href=\"#concepts/commercial-support\">commercial support</a> — Vendor-backed help for using and maintaining a project.</li>\n<li><a href=\"#concepts/contributor-workflow\">contributor workflow</a> — How users report issues and contribute changes to Ibex.</li>\n<li><a href=\"#concepts/open-source-licensing\">open source licensing</a> — How Ibex’s Apache 2.0 license governs use, modification, and distribution.</li>\n<li><a href=\"#concepts/verification\">verification</a> — Ibex verification is extensive and backed by multiple tape-outs.</li>\n<li><a href=\"#concepts/ibex\">ibex</a> — Ibex is a parametrizable open-source 32-bit RISC-V CPU core for embedded use.</li>\n<li><a href=\"#concepts/build-tooling\">build tooling</a> — Dependencies and tools used to build project documentation and assets.</li>\n<li><a href=\"#concepts/sphinx-documentation\">sphinx documentation</a> — Documentation built and styled with Sphinx and related extensions.</li>\n<li><a href=\"#concepts/open-source-hardware\">open source hardware</a> — Hardware designs released for public use, study, modification, and redistribution.</li>\n<li><a href=\"#concepts/embedded-processors\">embedded processors</a> — CPUs optimized for constrained, dedicated embedded control systems.</li>\n<li><a href=\"#concepts/risc-v\">risc v</a> — RISC-V is the open ISA foundation for Ibex and its configurable compliance</li>\n</ul>\n<h2>Explorations</h2>"}, {"id": "summaries/0001_index_bd80d85a59", "kind": "Summary", "title": "0001 index bd80d85a59", "html": "<h1>Summary: Ibex Documentation Index</h1>\n<p>This document is the top-level entry point for the <strong>Ibex</strong> documentation. It introduces Ibex as an <strong>open-source, production-quality, highly parameterizable 32-bit RISC-V CPU core</strong> written in SystemVerilog, intended primarily for <strong>embedded control applications</strong>. The document emphasizes that Ibex is extensively verified and has already been through multiple tape-outs, signaling a mature and hardware-proven design.</p>\n<h2>Main purpose</h2>\n<p>The page acts as a <strong>navigation hub</strong> for the full documentation set. It explains that the documentation is divided into four parts:</p>\n<ol>\n<li><strong>Overview documentation</strong> — high-level properties, standards compliance, and typical use cases.</li>\n<li><strong>User Guide</strong> — practical guidance for integrating Ibex into hardware designs and for writing software that runs on Ibex.</li>\n<li><strong>Reference Guide</strong> — deeper technical background, including design details, verification strategy, and testbench structure.</li>\n<li><strong>Developer Guide</strong> — guidance for contributors modifying Ibex itself and participating in the open development process.</li>\n</ol>\n<h2>Key ideas</h2>\n<ul>\n<li><strong>Ibex is a RISC-V processor core</strong> focused on embedded systems.</li>\n<li>It is <strong>heavily parametrizable</strong>, making it adaptable to different integration needs.</li>\n<li>The documentation is organized by audience and intent:</li>\n<li>high-level understanding,</li>\n<li>practical usage,</li>\n<li>technical reference,</li>\n<li>core development.</li>\n<li>The project is <strong>open source</strong>, and the documentation encourages users to become contributors.</li>\n</ul>\n<h2>Notable concepts</h2>\n<p>This document connects naturally to broader concepts such as:</p>\n<ul>\n<li><a href=\"#concepts/risc-v\">risc v</a> — the instruction-set architecture Ibex implements.</li>\n<li><a href=\"#concepts/embedded-processors\">embedded processors</a> — its intended application domain.</li>\n<li><a href=\"#concepts/hardware-verification\">hardware verification</a> — Ibex’s extensive verification effort.</li>\n<li><a href=\"#concepts/systemverilog\">systemverilog</a> — the implementation language used for the core.</li>\n<li><a href=\"#concepts/parameterized-design\">parameterized design</a> — the design approach enabling configurability.</li>\n<li><a href=\"#concepts/open-source-hardware\">open source hardware</a> — the development and collaboration model.</li>\n</ul>\n<h2>Why this page matters</h2>\n<p>Although it contains little technical detail itself, this index page defines the <strong>structure and scope</strong> of the entire Ibex documentation set. It establishes the documentation’s audience segmentation and highlights the core themes that recur throughout the rest of the manual: architecture, integration, verification, and development.</p>"}, {"id": "summaries/0002_requirements_e3923399fe", "kind": "Summary", "title": "0002 requirements e3923399fe", "html": "<h1>Summary: ibex/doc/requirements.txt</h1>\n<p>This document is a minimal dependency list for building the <strong>ibex</strong> documentation environment.</p>\n<h2>Key contents</h2>\n<p>The requirements specify the following Python packages:</p>\n<ul>\n<li><code>setuptools_scm</code></li>\n<li><code>sphinx&gt;=7.0</code></li>\n<li><code>sphinx_rtd_theme</code></li>\n<li><code>sphinxcontrib-wavedrom</code></li>\n<li><code>wavedrom&gt;=1.9.0rc1</code></li>\n<li><code>jinja2 == 3.0.3</code></li>\n</ul>\n<h2>Main purpose</h2>\n<p>The file appears to define the tooling needed for documentation generation, especially:</p>\n<ul>\n<li><strong>Sphinx-based documentation</strong> via <code>sphinx</code></li>\n<li><strong>Read the Docs styling</strong> via <code>sphinx_rtd_theme</code></li>\n<li><strong>WaveDrom rendering support</strong> via <code>sphinxcontrib-wavedrom</code> and <code>wavedrom</code></li>\n<li><strong>Build/version integration</strong> via <code>setuptools_scm</code></li>\n<li><strong>Template rendering support</strong> via <code>jinja2</code></li>\n</ul>\n<h2>Notable observations</h2>\n<ul>\n<li>The dependency set is compact and focused on docs generation rather than runtime software.</li>\n<li><code>sphinx&gt;=7.0</code> indicates a relatively modern Sphinx build target.</li>\n<li><code>jinja2</code> is pinned exactly to <code>3.0.3</code>, suggesting compatibility sensitivity.</li>\n<li><code>wavedrom&gt;=1.9.0rc1</code> suggests the documentation includes timing diagrams or other waveform-style visuals.</li>\n</ul>\n<h2>Related concepts</h2>\n<p>This document relates to broader topics such as <a href=\"#concepts/sphinx-documentation\">sphinx documentation</a> and <a href=\"#concepts/build-tooling\">build tooling</a> if those concept pages are created later.</p>\n<h2>Bottom line</h2>\n<p><code>ibex/doc/requirements.txt</code> defines the exact Python dependencies needed to build and style the ibex documentation, including Sphinx and WaveDrom support.</p>\n<h2>Related Concepts</h2>\n<ul>\n<li><a href=\"#concepts/embedded-processors\">embedded processors</a></li>\n<li><a href=\"#concepts/open-source-hardware\">open source hardware</a></li>\n<li><a href=\"#concepts/risc-v\">risc v</a></li>\n</ul>"}, {"id": "summaries/0003_compliance_32f20a4d58", "kind": "Summary", "title": "0003 compliance 32f20a4d58", "html": "<h1>Summary: Standards Compliance for Ibex</h1>\n<p>This document summarizes the RISC-V standards compliance profile of the <a href=\"#ibex\">ibex</a> processor. It lists the specification versions Ibex targets, the ISA base profiles it can be configured for, and the instruction set extensions and privileged features it supports.</p>\n<h2>Core compliance targets</h2>\n<p>Ibex is described as a standards-compliant 32-bit RISC-V processor. It aligns with these major specifications:</p>\n<ul>\n<li><a href=\"#RISC-V\">RISC V</a> User-Level ISA, Volume I, version 20190608</li>\n<li><a href=\"#RISC-V\">RISC V</a> Privileged Architecture, Volume II, version 20211203, with Ibex implementing Machine ISA version 1.12</li>\n<li>RISC-V External Debug Support, version 0.13.2</li>\n<li><a href=\"#RISC-V Bit-Manipulation Extension\">RISC V Bit Manipulation Extension</a> versions 1.0.0 and draft 0.93</li>\n<li><a href=\"#Smepmp\">Smepmp</a> version 1.0 for enhanced PMP-based memory protection</li>\n</ul>\n<h2>Configurable base ISA support</h2>\n<p>Ibex can be configured to implement either of the following base instruction sets:</p>\n<ul>\n<li><a href=\"#RV32I\">RV32I</a> Base Integer Instruction Set, version 2.1</li>\n<li><a href=\"#RV32E\">RV32E</a> Base Integer Instruction Set, version 1.9</li>\n</ul>\n<p>This emphasizes that Ibex is parameterized rather than fixed to a single base profile.</p>\n<h2>Supported instruction set extensions</h2>\n<p>The document lists the main extensions available in Ibex and whether they are always enabled or optional:</p>\n<ul>\n<li><strong>C</strong> — Compressed Instructions: always enabled</li>\n<li><strong>M</strong> — Integer Multiplication and Division: optional</li>\n<li><strong>B</strong> — Bit-Manipulation: optional</li>\n<li><strong>Zicsr</strong> — CSR instructions: always enabled</li>\n<li><strong>Zifencei</strong> — Instruction-fetch fence: always enabled</li>\n<li><strong>Zcb</strong> — Code-size saving instructions: optional</li>\n<li><strong>Zcmp</strong> — Push/pop/move code-size saving instructions: optional</li>\n<li><strong>Smepmp</strong> — PMP enhancements for machine-mode memory access and execution prevention: always enabled when PMP is configured</li>\n</ul>\n<p>These extensions show that Ibex balances baseline compatibility with area- and feature-dependent configurability.</p>\n<h2>Privileged architecture features</h2>\n<p>According to the RISC-V Privileged Specification, Ibex supports:</p>\n<ul>\n<li><a href=\"#Machine Mode\">Machine Mode</a> and <a href=\"#User Mode\">User Mode</a></li>\n<li>All CSRs referenced by the privileged architecture documentation</li>\n<li>Performance counters</li>\n<li>Vectorized trap handling for exceptions and interrupts</li>\n</ul>\n<p>This indicates support for core operating-system and runtime features needed by software stacks targeting RISC-V.</p>\n<h2>Bit-manipulation note</h2>\n<p>The footnote clarifies an important compatibility detail: Ibex fully implements the ratified B-extension 1.0.0, including sub-extensions Zba, Zbb, Zbc, and Zbs. It also supports additional draft sub-extensions (Zbe, Zbf, Zbp, Zbr, Zbt) from version 0.93, with the caveat that draft features may change and may not be supported consistently by toolchains such as GCC or Clang.</p>\n<h2>Takeaway</h2>\n<p>The document positions Ibex as a configurable, standards-oriented <a href=\"#RISC-V\">RISC V</a> core with strong compliance across base ISA, privileged architecture, debug, and selected optional extensions. Its main theme is that compliance depends on configuration, especially for features like <a href=\"#RV32I\">RV32I</a>, <a href=\"#RV32E\">RV32E</a>, <a href=\"#M extension\">M extension</a>, <a href=\"#B extension\">B extension</a>, and <a href=\"#Smepmp\">Smepmp</a>.</p>\n<h2>Related Concepts</h2>\n<ul>\n<li><a href=\"#concepts/risc-v\">risc v</a></li>\n<li><a href=\"#concepts/embedded-processors\">embedded processors</a></li>\n<li><a href=\"#concepts/open-source-hardware\">open source hardware</a></li>\n<li><a href=\"#concepts/sphinx-documentation\">sphinx documentation</a></li>\n</ul>"}, {"id": "summaries/0004_index_3411d17b96", "kind": "Summary", "title": "0004 index 3411d17b96", "html": "<h1>Summary: Introduction to Ibex</h1>\n<p>This document introduces <strong>Ibex</strong>, an open-source <strong>32-bit RISC-V CPU core</strong> written in <strong>SystemVerilog</strong>. It positions Ibex as a <strong>production-quality</strong>, <strong>heavily parametrizable</strong> processor aimed at <strong>embedded control applications</strong>.</p>\n<h2>Key points</h2>\n<ul>\n<li><strong>Open-source RISC-V core</strong>: Ibex implements a 32-bit RISC-V CPU design.</li>\n<li><strong>SystemVerilog implementation</strong>: The core is written in SystemVerilog.</li>\n<li><strong>Parametrizable architecture</strong>: It is designed to be highly configurable for different use cases.</li>\n<li><strong>Embedded focus</strong>: The target application area is embedded control systems.</li>\n<li><strong>Mature verification status</strong>: Ibex is described as extensively verified and has undergone multiple tape-outs.</li>\n</ul>\n<h2>What this section points to</h2>\n<p>The introduction serves as a gateway to the main topics in the Ibex documentation:</p>\n<ul>\n<li><a href=\"#concepts/risc-v-compliance\">risc v compliance</a> — the standards and ISA compliance supported by Ibex</li>\n<li><a href=\"#concepts/synthesis-targets\">synthesis targets</a> — supported implementation and synthesis targets</li>\n<li><a href=\"#concepts/licensing-obligations\">licensing obligations</a> — legal and financial requirements for use</li>\n<li><a href=\"#concepts/verification\">verification</a> — the verification strategy and maturity of the core</li>\n</ul>\n<h2>Overall significance</h2>\n<p>This page frames Ibex as a practical, real-world CPU core rather than a purely academic design: it emphasizes <strong>standards support</strong>, <strong>deployability</strong>, <strong>verification confidence</strong>, and <strong>usage obligations</strong>. It is best read as the high-level entry point for the rest of the Ibex overview section.</p>\n<h2>Related Concepts</h2>\n<ul>\n<li><a href=\"#concepts/ibex\">ibex</a></li>\n<li><a href=\"#concepts/embedded-processors\">embedded processors</a></li>\n<li><a href=\"#concepts/open-source-hardware\">open source hardware</a></li>\n</ul>"}, {"id": "summaries/0005_licensing_d3fe8b66d2", "kind": "Summary", "title": "0005 licensing d3fe8b66d2", "html": "<h1>Licensing</h1>\n<p>This document states that <strong>Ibex</strong> is released under the <strong>Apache License 2.0</strong>.</p>\n<h2>Key points</h2>\n<ul>\n<li>Ibex may be <strong>used, modified, and distributed</strong> for any purpose, including commercial use.</li>\n<li>There are standard Apache 2.0 requirements, especially around <strong>preserving copyright notices</strong> and <strong>including the original license</strong>.</li>\n<li>The full and legally binding terms are in the repository’s <code>LICENSE</code> file.</li>\n<li>Although not required by the license, the project welcomes <strong>feedback and contributions</strong> to improve Ibex.</li>\n<li>Users are encouraged to report bugs, ask questions, or suggest improvements via a GitHub <strong>issue</strong>, and to contribute code through a <strong>pull request</strong>.</li>\n<li><strong>Commercial support</strong> is available from lowRISC.</li>\n</ul>\n<h2>Cross-document concepts</h2>\n<ul>\n<li><a href=\"#concepts/open_source_licensing\">open_source_licensing</a> — Licensing model, reuse rights, and notice obligations.</li>\n<li><a href=\"#concepts/contributor_workflow\">contributor_workflow</a> — Issue reporting, pull requests, and community contribution norms.</li>\n<li><a href=\"#concepts/commercial_support\">commercial_support</a> — Optional vendor-backed support for open source projects.</li>\n</ul>\n<h2>Related Concepts</h2>\n<ul>\n<li><a href=\"#concepts/open-source-licensing\">open source licensing</a></li>\n<li><a href=\"#concepts/contributor-workflow\">contributor workflow</a></li>\n<li><a href=\"#concepts/commercial-support\">commercial support</a></li>\n<li><a href=\"#concepts/ibex\">ibex</a></li>\n<li><a href=\"#concepts/open-source-hardware\">open source hardware</a></li>\n</ul>"}, {"id": "concepts/build-tooling", "kind": "Concept", "title": "build tooling", "html": "<h1>Build Tooling</h1>\n<p>Build tooling is the collection of dependencies and utilities used to generate, render, and package project artifacts rather than to run the project itself. In this wiki, it covers the documentation build environment and its supporting libraries.</p>\n<h2>What it includes</h2>\n<p>From <a href=\"#summaries/0002_requirements_e3923399fe\">0002_requirements_e3923399fe</a>, the <code>ibex</code> documentation build setup depends on:</p>\n<ul>\n<li><code>setuptools_scm</code> — versioning support from source control metadata</li>\n<li><code>sphinx&gt;=7.0</code> — the documentation generator</li>\n<li><code>sphinx_rtd_theme</code> — the Read the Docs HTML theme</li>\n<li><code>sphinxcontrib-wavedrom</code> — Sphinx integration for WaveDrom diagrams</li>\n<li><code>wavedrom&gt;=1.9.0rc1</code> — waveform/timing diagram rendering</li>\n<li><code>jinja2 == 3.0.3</code> — template rendering used by the docs toolchain</li>\n</ul>\n<h2>Why build tooling matters</h2>\n<p>Build tooling defines the reproducible environment needed to turn source material into published outputs. For documentation, this typically means:</p>\n<ul>\n<li>converting source text into rendered pages</li>\n<li>applying a consistent visual theme</li>\n<li>generating diagrams or other embedded assets</li>\n<li>handling templates and build-time metadata</li>\n<li>ensuring compatible tool versions are used together</li>\n</ul>\n<h2>Key characteristics seen in the source</h2>\n<p>The requirements file suggests a documentation-focused toolchain with a few important traits:</p>\n<ul>\n<li><strong>Modern Sphinx baseline</strong>: <code>sphinx&gt;=7.0</code> indicates the project targets current Sphinx behavior.</li>\n<li><strong>Themed output</strong>: <code>sphinx_rtd_theme</code> standardizes the visual presentation of the docs.</li>\n<li><strong>Diagram support</strong>: <code>sphinxcontrib-wavedrom</code> and <code>wavedrom</code> imply the docs include waveform-style diagrams.</li>\n<li><strong>Version pinning for stability</strong>: <code>jinja2 == 3.0.3</code> is pinned exactly, likely to avoid template compatibility issues.</li>\n<li><strong>Source-controlled versioning</strong>: <code>setuptools_scm</code> indicates the build may derive version information automatically.</li>\n</ul>\n<h2>Relationship to other concepts</h2>\n<p>Build tooling often connects to:</p>\n<ul>\n<li><a href=\"#concepts/sphinx-documentation\">sphinx documentation</a> — the broader Sphinx-based docs workflow</li>\n<li><a href=\"#concepts/documentation-workflow\">documentation workflow</a> — how source docs become published output</li>\n<li><a href=\"#concepts/dependency-management\">dependency management</a> — controlling versions and compatibility across tools</li>\n</ul>\n<h2>Source-specific takeaway</h2>\n<p>The <code>ibex</code> requirements file is a concise example of documentation build tooling: it assembles the minimum set of packages needed to build styled, diagram-enabled documentation reliably.</p>\n<p>See also: <a href=\"#summaries/0002_requirements_e3923399fe\">0002_requirements_e3923399fe</a></p>"}, {"id": "concepts/commercial-support", "kind": "Concept", "title": "commercial support", "html": "<h1>Commercial Support</h1>\n<p>Commercial support refers to paid assistance offered by a project vendor or maintainer organization to help users adopt, operate, and extend the software.</p>\n<p>In the case of <a href=\"#summaries/0005_licensing_d3fe8b66d2\">0005_licensing_d3fe8b66d2</a>, the licensing document notes that <strong>commercial support for Ibex is available from lowRISC</strong>. This means that, beyond the open-source license itself, organizations can seek a formal support relationship when they need help with integration, troubleshooting, or project-specific guidance.</p>\n<h2>What it typically includes</h2>\n<ul>\n<li>Implementation and integration help</li>\n<li>Bug investigation and troubleshooting</li>\n<li>Guidance for customization or product use</li>\n<li>Escalation paths for production issues</li>\n<li>Potential training or consulting services</li>\n</ul>\n<h2>Why it matters</h2>\n<p>Commercial support is useful when a team needs:</p>\n<ul>\n<li>Faster responses than community channels can provide</li>\n<li>Confidence using the software in a commercial or mission-critical setting</li>\n<li>Expert advice from the organization closest to the project</li>\n<li>A way to budget for long-term maintenance and adoption</li>\n</ul>\n<h2>In the source document</h2>\n<p>The licensing summary makes two related points:</p>\n<ol>\n<li>Ibex is open source under the Apache 2.0 license, so it can be used freely.</li>\n<li>Even with that permissive license, <strong>commercial support is available from lowRISC</strong>.</li>\n</ol>\n<p>This combination is common in open-source ecosystems: the software remains openly licensed while professional support is offered separately.</p>\n<h2>Related concepts</h2>\n<ul>\n<li><a href=\"#concepts/open_source_licensing\">open_source_licensing</a> — The legal framework that allows open use and redistribution.</li>\n<li><a href=\"#concepts/contributor_workflow\">contributor_workflow</a> — Community participation through issues and pull requests.</li>\n<li><a href=\"#summaries/0005_licensing_d3fe8b66d2\">0005_licensing_d3fe8b66d2</a> — Source document noting commercial support availability.</li>\n</ul>"}, {"id": "concepts/contributor-workflow", "kind": "Concept", "title": "contributor workflow", "html": "<h1>Contributor Workflow</h1>\n<p>The <strong>contributor workflow</strong> describes the main ways people can interact with the Ibex project to improve it: reporting bugs, asking questions, suggesting enhancements, and submitting code changes.</p>\n<h2>Overview</h2>\n<p>In the licensing document, Ibex explicitly encourages community participation even though the license does not require it. The project asks users to:</p>\n<ul>\n<li>open a GitHub <strong>issue</strong> for bug reports, questions, or suggested improvements</li>\n<li>submit a <strong>pull request</strong> if they want to contribute code</li>\n</ul>\n<p>This reflects a lightweight, open contribution model centered on public issue tracking and pull-request-based development.</p>\n<h2>Key elements</h2>\n<h3>Issue reporting</h3>\n<p>Issues are the preferred channel for:</p>\n<ul>\n<li>bug reports</li>\n<li>questions</li>\n<li>feature suggestions</li>\n<li>general improvement ideas</li>\n</ul>\n<p>This makes the issue tracker the main entry point for non-code participation.</p>\n<h3>Code contributions</h3>\n<p>Pull requests are the expected mechanism for proposing code changes. This supports a review-based workflow where external contributors can propose fixes or enhancements for maintainers to evaluate.</p>\n<h3>Community feedback</h3>\n<p>The document also notes that feedback is appreciated, even though it is not required by the license. This reinforces a collaborative project culture.</p>\n<h2>Why it matters</h2>\n<p>A contributor workflow helps keep the project maintainable and community-friendly by providing clear paths for participation. For Ibex, the workflow is simple and direct:</p>\n<ul>\n<li>report problems in issues</li>\n<li>discuss ideas publicly</li>\n<li>contribute patches through pull requests</li>\n</ul>\n<h2>Related topics</h2>\n<ul>\n<li><a href=\"#summaries/0005_licensing_d3fe8b66d2\">0005_licensing_d3fe8b66d2</a> — Source document describing licensing and contribution guidance</li>\n<li><a href=\"#concepts/open_source_licensing\">open_source_licensing</a> — License terms that shape reuse and contribution expectations</li>\n<li><a href=\"#concepts/commercial_support\">commercial_support</a> — Support options mentioned alongside community contribution channels</li>\n</ul>"}, {"id": "concepts/embedded-processors", "kind": "Concept", "title": "embedded processors", "html": "<h1>Embedded Processors</h1>\n<p>Embedded processors are CPU cores designed for use inside dedicated hardware systems rather than general-purpose computers. They are typically optimized for <strong>small size, low power, predictable behavior, and easy integration</strong> into a wider system-on-chip or control device. These processors often serve applications such as industrial controllers, consumer electronics, automotive subsystems, and other resource-constrained embedded environments.</p>\n<p>The Ibex overview document reinforces this framing by describing Ibex as a <strong>production-quality open source 32-bit RISC-V CPU core</strong> written in <strong>SystemVerilog</strong> that is <strong>heavily parametrizable</strong> and <strong>well suited for embedded control applications</strong>. It also notes that Ibex has been <strong>extensively verified</strong> and has seen <strong>multiple tape-outs</strong>, which signals the level of maturity often required in embedded deployment.</p>\n<h2>Core characteristics</h2>\n<p>Embedded processors usually share several traits:</p>\n<ul>\n<li><strong>Application-specific focus</strong> — built for control, coordination, or dedicated device logic.</li>\n<li><strong>Resource awareness</strong> — designed with constraints on area, power, and cost in mind.</li>\n<li><strong>Configurability</strong> — often adaptable to different product requirements.</li>\n<li><strong>Hardware integration</strong> — intended to be embedded into larger digital systems.</li>\n<li><strong>Predictable operation</strong> — important for control-oriented workloads and real-time behavior.</li>\n<li><strong>Verification maturity</strong> — strong validation is often necessary before deployment in shipping hardware.</li>\n</ul>\n<h2>How Ibex fits this concept</h2>\n<p>The Ibex documentation highlights several features that align with <a href=\"#embedded-processors\">embedded processors</a> design goals:</p>\n<ul>\n<li>It is an <strong>open-source, production-quality 32-bit RISC-V CPU core</strong>.</li>\n<li>It targets <strong>embedded control applications</strong>.</li>\n<li>It is <strong>heavily parametrizable</strong>, supporting varied integration needs.</li>\n<li>It is written in <strong>SystemVerilog</strong>, making it suitable for hardware implementation and integration.</li>\n<li>It participates in a <strong>compliance</strong> and <strong>verification</strong> documentation structure, reflecting the importance of standards and validation for embedded use.</li>\n<li>Its extensive verification and multiple tape-outs suggest maturity for practical embedded deployment.</li>\n</ul>\n<p>The documentation structure also reflects the embedded processor lifecycle and concerns:</p>\n<ul>\n<li><a href=\"#summaries/0004_index_3411d17b96\">0004_index_3411d17b96</a> introduces the project as an embedded-capable CPU core and points to the main overview topics.</li>\n<li>The linked sections cover <strong>compliance</strong>, <strong>targets</strong>, <strong>licensing</strong>, and <strong>verification_overview</strong>, which map to the typical concerns of an embedded processor consumer.</li>\n<li>Supporting documentation helps readers understand where the core can be synthesized, what standards it follows, and what obligations apply when integrating it into a product.</li>\n</ul>\n<h2>Related concepts</h2>\n<ul>\n<li><a href=\"#concepts/risc-v\">risc v</a> — the ISA implemented by Ibex.</li>\n<li><a href=\"#concepts/systemverilog\">systemverilog</a> — the implementation language.</li>\n<li><a href=\"#concepts/parameterized-design\">parameterized design</a> — the ability to tailor processor features.</li>\n<li><a href=\"#concepts/hardware-verification\">hardware verification</a> — essential for dependable embedded deployment.</li>\n<li><a href=\"#concepts/open-source-hardware\">open source hardware</a> — the collaborative development model.</li>\n<li><a href=\"#concepts/risc-v-compliance\">risc v compliance</a> — relevant because Ibex documents what standards it implements.</li>\n<li><a href=\"#concepts/synthesis-targets\">synthesis targets</a> — relevant because embedded processors must fit specific hardware platforms.</li>\n<li><a href=\"#concepts/licensing-obligations\">licensing obligations</a> — important when using open-source cores in products.</li>\n</ul>\n<h2>Summary</h2>\n<p>Embedded processors are specialized CPU cores for dedicated hardware systems, where efficient use of resources and dependable behavior matter more than broad-purpose computing. Ibex exemplifies this category through its embedded-control focus, configurability, SystemVerilog implementation, and strong verification pedigree.</p>"}, {"id": "concepts/ibex", "kind": "Concept", "title": "ibex", "html": "<h1>Ibex CPU Core</h1>\n<p>Ibex is a <strong>production-quality open-source 32-bit RISC-V CPU core</strong> written in <strong>SystemVerilog</strong>. It is designed to be <strong>heavily parametrizable</strong>, making it adaptable to a range of embedded designs and implementation goals.</p>\n<p>The core is presented as a mature, real-world processor intended for <strong>embedded control applications</strong>, with evidence of strong engineering maturity through <strong>extensive verification</strong> and <strong>multiple tape-outs</strong>.</p>\n<h2>Core characteristics</h2>\n<ul>\n<li><strong>ISA / architecture</strong>: 32-bit <a href=\"#concepts/risc-v\">risc v</a> compatible CPU core</li>\n<li><strong>Language</strong>: SystemVerilog</li>\n<li><strong>Licensing model</strong>: Open source under the <strong>Apache License 2.0</strong></li>\n<li><strong>Design style</strong>: Highly parametrizable</li>\n<li><strong>Primary use case</strong>: Embedded control systems</li>\n<li><strong>Maturity indicators</strong>: Extensive verification and multiple tape-outs</li>\n</ul>\n<h2>Licensing and use</h2>\n<p>Ibex is released under the Apache license, version 2.0. This means it can be <strong>used, modified, and distributed</strong> for any purpose, including commercial use, without royalties.</p>\n<p>The main obligations are the usual Apache 2.0 requirements: users should preserve the <strong>copyright notices</strong> and include the <strong>original license</strong>. The repository’s <code>LICENSE</code> file contains the full and legally binding license text.</p>\n<p>Even though the license does not require it, the project explicitly welcomes <strong>feedback, bug reports, questions, suggested improvements, and code contributions</strong>. Community involvement is encouraged through GitHub <strong>issues</strong> and <strong>pull requests</strong>, and commercial support is available from lowRISC.</p>\n<p>Related licensing themes are captured in <a href=\"#concepts/licensing-obligations\">licensing obligations</a>, <a href=\"#concepts/open_source_licensing\">open_source_licensing</a>, <a href=\"#concepts/contributor_workflow\">contributor_workflow</a>, and <a href=\"#concepts/commercial_support\">commercial_support</a>.</p>\n<h2>Why Ibex matters</h2>\n<p>Ibex sits at the intersection of several important hardware design concerns:</p>\n<ul>\n<li><strong>Standards compliance</strong>: It is part of the RISC-V ecosystem and is expected to align with relevant implementation and compliance requirements.</li>\n<li><strong>Adaptability</strong>: Parameterization makes it useful for different silicon targets and product constraints.</li>\n<li><strong>Trustworthiness</strong>: Verification and tape-out history suggest a design that has progressed beyond a prototype stage.</li>\n<li><strong>Practical deployment</strong>: Its focus on embedded control makes it relevant for resource-constrained systems where a small, reliable CPU core is needed.</li>\n<li><strong>Adoption friendliness</strong>: The permissive Apache 2.0 license lowers barriers to reuse in both open and commercial settings.</li>\n</ul>\n<h2>Related themes</h2>\n<ul>\n<li><a href=\"#concepts/risc-v-compliance\">risc v compliance</a> — the standards and compliance context around Ibex</li>\n<li><a href=\"#concepts/synthesis-targets\">synthesis targets</a> — the kinds of hardware targets Ibex may be synthesized for</li>\n<li><a href=\"#concepts/verification\">verification</a> — the verification practices supporting confidence in the core</li>\n<li><a href=\"#concepts/licensing-obligations\">licensing obligations</a> — legal and financial considerations when using Ibex</li>\n<li><a href=\"#concepts/open_source_licensing\">open_source_licensing</a> — open source licensing model and reuse rights</li>\n<li><a href=\"#concepts/contributor_workflow\">contributor_workflow</a> — issue reporting, pull requests, and contribution norms</li>\n<li><a href=\"#concepts/commercial_support\">commercial_support</a> — vendor-backed support options</li>\n<li><a href=\"#summaries/0004_index_3411d17b96\">0004_index_3411d17b96</a> — source summary for the introduction page</li>\n</ul>\n<h2>Source context</h2>\n<p>The source document is the introduction to the Ibex documentation tree. It serves as an entry point to deeper topics such as compliance, supported targets, licensing, contribution practices, and verification overview.</p>\n<h2>Related Documents</h2>\n<ul>\n<li><a href=\"#summaries/0005_licensing_d3fe8b66d2\">0005_licensing_d3fe8b66d2</a></li>\n</ul>"}, {"id": "concepts/open-source-hardware", "kind": "Concept", "title": "open source hardware", "html": "<h1>Open Source Hardware</h1>\n<p>Open source hardware refers to physical designs that are published so others can <strong>inspect, use, modify, and share</strong> them. In practice, this means the design files, documentation, and development process are made available to the public under terms that support collaboration and reuse.</p>\n<p>The Ibex documentation index explicitly frames Ibex as an <strong>open source</strong> project and encourages users to learn how to adapt the core to their own use case and participate in the development process. That makes Ibex a good example of open source hardware in the digital design space: a processor core whose source code and documentation are intended to be shared and extended by others.</p>\n<h2>Key characteristics</h2>\n<ul>\n<li><strong>Public availability</strong> of design materials</li>\n<li><strong>Permission to modify and redistribute</strong> the design</li>\n<li><strong>Collaborative development</strong> with community contributions</li>\n<li><strong>Transparent documentation</strong> that helps users understand and adapt the hardware</li>\n<li><strong>Reuse-oriented design</strong>, often with parametrization to support integration in different systems</li>\n</ul>\n<h2>In the Ibex context</h2>\n<p>From <a href=\"#summaries/0001_index_bd80d85a59\">0001_index_bd80d85a59</a>, Ibex is described as:</p>\n<ul>\n<li>an <strong>open source</strong> 32-bit RISC-V CPU core</li>\n<li>written in <strong>SystemVerilog</strong></li>\n<li><strong>heavily parametrizable</strong> for embedded control applications</li>\n<li>supported by documentation aimed at both users and developers</li>\n<li>part of an <strong>open development process</strong> that encourages adaptation and contribution</li>\n</ul>\n<p>This combination reflects a common open source hardware pattern: the core is not only published, but also designed to be understandable, configurable, and extensible by downstream users.</p>\n<h2>Why it matters</h2>\n<p>Open source hardware lowers barriers to entry for hardware development by making sophisticated designs accessible to a wider audience. It can improve:</p>\n<ul>\n<li><strong>adoption</strong> — by enabling reuse in new systems</li>\n<li><strong>trust</strong> — through visibility into the design</li>\n<li><strong>innovation</strong> — by allowing modifications and derivative work</li>\n<li><strong>education</strong> — by providing real-world reference implementations</li>\n</ul>\n<h2>Related concepts</h2>\n<ul>\n<li><a href=\"#concepts/risc-v\">risc v</a> — the open instruction-set architecture implemented by Ibex</li>\n<li><a href=\"#concepts/embedded-processors\">embedded processors</a> — the application domain Ibex targets</li>\n<li><a href=\"#concepts/systemverilog\">systemverilog</a> — the HDL used to implement the core</li>\n<li><a href=\"#concepts/parameterized-design\">parameterized design</a> — a design style that supports reuse and adaptation</li>\n<li><a href=\"#concepts/hardware-verification\">hardware verification</a> — important for ensuring reliability in shared hardware designs</li>\n</ul>\n<p>See also: <a href=\"#summaries/0002_requirements_e3923399fe\">0002_requirements_e3923399fe</a></p>\n<p>See also: <a href=\"#summaries/0003_compliance_32f20a4d58\">0003_compliance_32f20a4d58</a></p>\n<p>See also: <a href=\"#summaries/0004_index_3411d17b96\">0004_index_3411d17b96</a></p>\n<p>See also: <a href=\"#summaries/0005_licensing_d3fe8b66d2\">0005_licensing_d3fe8b66d2</a></p>"}, {"id": "concepts/open-source-licensing", "kind": "Concept", "title": "open source licensing", "html": "<h1>Open Source Licensing</h1>\n<p>Open source licensing defines the legal terms under which software can be used, modified, and redistributed. In the case of <a href=\"#summaries/0005_licensing_d3fe8b66d2\">0005_licensing_d3fe8b66d2</a>, <strong>Ibex</strong> is released under the <strong>Apache License 2.0</strong>, which is a permissive license designed to allow broad use, including commercial applications.</p>\n<h2>What this means</h2>\n<p>Ibex’s license grants users the freedom to:</p>\n<ul>\n<li><strong>Use</strong> the software for any purpose</li>\n<li><strong>Modify</strong> the source code to fit their needs</li>\n<li><strong>Distribute</strong> original or modified versions</li>\n<li><strong>Use commercially</strong> without paying royalties</li>\n</ul>\n<p>These freedoms make Apache 2.0 a common choice for projects that want to encourage adoption and collaboration while keeping basic legal protections in place.</p>\n<h2>Core obligations</h2>\n<p>Although permissive, Apache 2.0 still requires attention to a few important conditions:</p>\n<ul>\n<li>Keep the <strong>copyright notices</strong> intact</li>\n<li>Include the <strong>license text</strong> with redistributions</li>\n<li>Follow the terms in the repository’s <code>LICENSE</code> file, which is the authoritative legal reference</li>\n</ul>\n<p>This balance of flexibility and attribution is a defining feature of the license.</p>\n<h2>Community and contribution culture</h2>\n<p>The document also emphasizes that licensing is not only about legal permission; it shapes how a project engages with its community. Even though contributions are not required by the license, the project encourages:</p>\n<ul>\n<li>filing <a href=\"#concepts/contributor_workflow|issues\">contributor_workflow|issues</a> for bugs, questions, or improvements</li>\n<li>submitting <a href=\"#concepts/contributor_workflow|pull requests\">contributor_workflow|pull requests</a> with code changes</li>\n<li>sharing feedback to improve the project for everyone</li>\n</ul>\n<h2>Commercial support</h2>\n<p>A permissive open source license does not prevent commercial services around the project. The document notes that <strong>commercial support</strong> is available from lowRISC, showing how open source licensing can coexist with paid support offerings.</p>\n<h2>Related concepts</h2>\n<ul>\n<li><a href=\"#concepts/contributor_workflow\">contributor_workflow</a> — How users report issues and contribute code</li>\n<li><a href=\"#concepts/commercial_support\">commercial_support</a> — Paid support options alongside open source distribution</li>\n<li><a href=\"#summaries/0005_licensing_d3fe8b66d2\">0005_licensing_d3fe8b66d2</a> — Source summary for the Ibex licensing document</li>\n</ul>"}, {"id": "concepts/risc-v", "kind": "Concept", "title": "risc v", "html": "<h1>RISC-V</h1>\n<p>RISC-V is an open instruction set architecture (ISA) for building processors and CPU cores. It defines the machine-level instructions, programmer-visible behavior, and architectural conventions that software and hardware must follow to be compatible.</p>\n<h2>Why it matters in Ibex</h2>\n<p>The Ibex documentation identifies the core as an <strong>embedded 32-bit RISC-V CPU core</strong> <a href=\"#summaries/0001_index_bd80d85a59\">0001_index_bd80d85a59</a>. That means Ibex implements the RISC-V ISA as its architectural contract with software, while remaining configurable and suitable for embedded control applications.</p>\n<p>The compliance documentation makes this relationship more concrete: Ibex is a standards-compliant 32-bit RISC-V processor that tracks specific versions of the user-level ISA, privileged architecture, debug support, bit-manipulation, and machine-mode memory protection extensions <a href=\"#summaries/0003_compliance_32f20a4d58\">0003_compliance_32f20a4d58</a>. In other words, RISC-V is not just the general foundation for Ibex — it is the formal compatibility target that shapes what the core can run and which features it exposes.</p>\n<h2>Key characteristics</h2>\n<ul>\n<li><strong>Open ISA</strong>: RISC-V is publicly specified and widely adopted in open and commercial hardware.</li>\n<li><strong>Modular</strong>: The architecture supports a base instruction set with optional extensions.</li>\n<li><strong>32-bit support</strong>: Ibex is documented as a 32-bit implementation, targeting embedded-class systems.</li>\n<li><strong>Configurable compliance</strong>: Ibex can be configured for either <a href=\"#RV32I\">RV32I</a> or <a href=\"#RV32E\">RV32E</a>, and several extensions are optional while others are always enabled <a href=\"#summaries/0003_compliance_32f20a4d58\">0003_compliance_32f20a4d58</a>.</li>\n<li><strong>Software compatibility</strong>: Programs, compilers, and operating systems can target RISC-V-compliant cores.</li>\n</ul>\n<h2>Ibex’s RISC-V compliance profile</h2>\n<p>The compliance document shows that Ibex follows several RISC-V specifications and related standards:</p>\n<ul>\n<li>RISC-V User-Level ISA, Volume I, version 20190608</li>\n<li>RISC-V Privileged Architecture, Volume II, version 20211203</li>\n<li>RISC-V External Debug Support, version 0.13.2</li>\n<li>RISC-V Bit-Manipulation Extension, versions 1.0.0 and draft 0.93</li>\n<li><a href=\"#Smepmp\">Smepmp</a> for enhanced machine-mode PMP behavior</li>\n</ul>\n<p>Ibex also supports privileged features including:</p>\n<ul>\n<li>M-mode and U-mode</li>\n<li>all documented CSRs</li>\n<li>performance counters</li>\n<li>vectorized trap handling</li>\n</ul>\n<p>This makes RISC-V in Ibex more than a baseline instruction set: it includes the privileged execution model and selected extension behavior needed for real embedded software stacks.</p>\n<h2>Base ISA and extensions in Ibex</h2>\n<p>Ibex can be configured to support either of the following base instruction sets:</p>\n<ul>\n<li><a href=\"#RV32I\">RV32I</a> Base Integer Instruction Set, version 2.1</li>\n<li><a href=\"#RV32E\">RV32E</a> Base Integer Instruction Set, version 1.9</li>\n</ul>\n<p>It also supports a set of standard extensions with different configurability:</p>\n<ul>\n<li><strong>C</strong> — Compressed Instructions: always enabled</li>\n<li><strong>M</strong> — Integer Multiplication and Division: optional</li>\n<li><strong>B</strong> — Bit-Manipulation: optional</li>\n<li><strong>Zicsr</strong> — CSR instructions: always enabled</li>\n<li><strong>Zifencei</strong> — Instruction-Fetch Fence: always enabled</li>\n<li><strong>Zcb</strong> — Simple code-size saving instructions: optional</li>\n<li><strong>Zcmp</strong> — Push/Pop/Move code-size saving instructions: optional</li>\n<li><strong>Smepmp</strong> — machine-mode PMP enhancements: always enabled in PMP-enabled configurations</li>\n</ul>\n<p>The B extension is especially notable because Ibex fully implements the ratified 1.0.0 version while also supporting additional draft sub-extensions from version 0.93, such as Zbe, Zbf, Zbp, Zbr, and Zbt <a href=\"#summaries/0003_compliance_32f20a4d58\">0003_compliance_32f20a4d58</a>.</p>\n<h2>In the context of the source document</h2>\n<p>The document does not explain the RISC-V ISA in general terms; instead, it establishes Ibex’s standards position by listing the exact architectural specifications it follows. That makes RISC-V the compliance framework for the rest of the Ibex documentation.</p>\n<p>The larger documentation set uses this foundation to organize material about:</p>\n<ul>\n<li>the high-level properties of the core,</li>\n<li>how to use it in designs,</li>\n<li>how the implementation works in detail,</li>\n<li>and how to contribute to the core itself.</li>\n</ul>\n<h2>Related concepts</h2>\n<ul>\n<li><a href=\"#concepts/embedded-processors\">embedded processors</a> — RISC-V cores like Ibex are commonly used in embedded systems.</li>\n<li><a href=\"#concepts/open-source-hardware\">open source hardware</a> — Ibex is open source, aligning with the openness of the ISA.</li>\n<li><a href=\"#concepts/systemverilog\">systemverilog</a> — the implementation language used for the core.</li>\n<li><a href=\"#concepts/parameterized-design\">parameterized design</a> — Ibex is heavily configurable while remaining RISC-V compatible.</li>\n<li><a href=\"#concepts/hardware-verification\">hardware verification</a> — verifying compliance and correctness is essential for ISA implementations.</li>\n<li><a href=\"#concepts/privileged-architecture\">privileged architecture</a> — Ibex implements the RISC-V privileged execution model.</li>\n<li><a href=\"#concepts/bit-manipulation-extension\">bit manipulation extension</a> — Ibex supports both ratified and draft B-extension features.</li>\n<li><a href=\"#concepts/machine-mode\">machine mode</a> — Machine mode support is part of the compliance profile.</li>\n</ul>\n<h2>See also</h2>\n<ul>\n<li><a href=\"#summaries/0001_index_bd80d85a59\">0001_index_bd80d85a59</a> — top-level Ibex documentation index that introduces the core as a RISC-V CPU.</li>\n<li><a href=\"#summaries/0002_requirements_e3923399fe\">0002_requirements_e3923399fe</a></li>\n<li><a href=\"#summaries/0003_compliance_32f20a4d58\">0003_compliance_32f20a4d58</a> — standards compliance details for Ibex.</li>\n</ul>"}, {"id": "concepts/sphinx-documentation", "kind": "Concept", "title": "sphinx documentation", "html": "<h1>Sphinx Documentation</h1>\n<p>Sphinx Documentation is a documentation workflow centered on <strong>Sphinx</strong>, a Python-based toolchain for generating project docs from source files such as reStructuredText or Markdown.</p>\n<h2>What it enables</h2>\n<p>Sphinx is commonly used to:</p>\n<ul>\n<li>build static documentation sites</li>\n<li>structure content with pages, sections, and cross-references</li>\n<li>apply themes and consistent visual styling</li>\n<li>integrate extensions for diagrams, code snippets, and API references</li>\n</ul>\n<h2>Key details from the source document</h2>\n<p>The summary for <a href=\"#summaries/0002_requirements_e3923399fe\">0002_requirements_e3923399fe</a> shows a documentation environment built around Sphinx with supporting packages:</p>\n<ul>\n<li><code>sphinx&gt;=7.0</code> — core documentation builder</li>\n<li><code>sphinx_rtd_theme</code> — Read the Docs-style theme for presentation</li>\n<li><code>sphinxcontrib-wavedrom</code> and <code>wavedrom&gt;=1.9.0rc1</code> — support for waveform/timing diagrams</li>\n<li><code>jinja2 == 3.0.3</code> — templating support used in the documentation pipeline</li>\n<li><code>setuptools_scm</code> — versioning/build metadata integration</li>\n</ul>\n<h2>Typical characteristics</h2>\n<p>A Sphinx-based documentation setup often emphasizes:</p>\n<ul>\n<li><strong>structured navigation</strong> through a documentation tree</li>\n<li><strong>theme customization</strong> for readable output</li>\n<li><strong>extension support</strong> for specialized content</li>\n<li><strong>version-aware builds</strong> when tied to source control metadata</li>\n</ul>\n<h2>Related concepts</h2>\n<p>This concept connects naturally to:</p>\n<ul>\n<li><a href=\"#concepts/build-tooling\">build tooling</a> — tooling used to assemble documentation artifacts</li>\n<li><a href=\"#concepts/wavedrom\">wavedrom</a> — waveform diagrams embedded in docs</li>\n<li><a href=\"#concepts/templates\">templates</a> — content generation and rendering support</li>\n</ul>\n<h2>Summary</h2>\n<p>In the ibex documentation requirements, Sphinx is the central documentation framework, with extensions and styling packages added to support modern, diagram-rich, and theme-consistent project docs.</p>\n<p>See also: <a href=\"#summaries/0003_compliance_32f20a4d58\">0003_compliance_32f20a4d58</a></p>"}, {"id": "concepts/verification", "kind": "Concept", "title": "verification", "html": "<h1>Verification</h1>\n<p>Verification refers to the process of checking that a hardware design behaves as intended across simulation, validation, and implementation stages. In the context of <a href=\"#summaries/0004_index_3411d17b96\">0004_index_3411d17b96</a>, verification is presented as one of the core strengths of Ibex: the CPU core is described as <strong>extensively verified</strong> and as having seen <strong>multiple tape-outs</strong>.</p>\n<h2>In Ibex</h2>\n<p>The overview document does not describe the full verification methodology, but it does establish an important signal of maturity:</p>\n<ul>\n<li>Ibex has undergone extensive verification.</li>\n<li>The design has reached physical implementation multiple times through tape-outs.</li>\n<li>This suggests the core has been exercised well beyond early prototype status.</li>\n</ul>\n<h2>Why verification matters</h2>\n<p>For an embedded RISC-V CPU core, verification is critical because it helps ensure:</p>\n<ul>\n<li>correctness of instruction execution</li>\n<li>predictable behavior in embedded control applications</li>\n<li>confidence in reuse across different synthesis targets</li>\n<li>reduced risk when integrating the core into larger SoCs</li>\n</ul>\n<h2>Related ideas</h2>\n<p>Verification connects closely with other themes introduced in the Ibex overview:</p>\n<ul>\n<li><a href=\"#concepts/risc-v-compliance\">risc v compliance</a> — verification is often tied to checking ISA and standard conformance</li>\n<li><a href=\"#concepts/synthesis-targets\">synthesis targets</a> — verified behavior should hold across supported implementation targets</li>\n<li><a href=\"#concepts/licensing-obligations\">licensing obligations</a> — not a technical verification topic, but part of the broader adoption context</li>\n</ul>\n<h2>Summary</h2>\n<p>In Ibex, verification is a maturity marker: the core is not only open source and configurable, but also described as <strong>well validated in practice</strong>. The mention of multiple tape-outs implies that verification has supported a design that has progressed through real hardware implementation stages.</p>"}];
    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    const search = document.getElementById('search');

    function renderNav(filter = '') {
      const query = filter.trim().toLowerCase();
      nav.innerHTML = '';
      const groups = ['Index', 'Summary', 'Concept'];
      for (const group of groups) {
        const groupPages = pages.filter(p => p.kind === group && (!query || p.title.toLowerCase().includes(query) || p.id.toLowerCase().includes(query)));
        if (!groupPages.length) continue;
        const label = document.createElement('div');
        label.className = 'group-label';
        label.textContent = `${group} (${groupPages.length})`;
        nav.appendChild(label);
        for (const page of groupPages) {
          const button = document.createElement('button');
          button.className = 'nav-item';
          button.dataset.pageId = page.id;
          button.textContent = page.title;
          button.onclick = () => showPage(page.id);
          nav.appendChild(button);
        }
      }
      syncActive();
    }

    function syncActive() {
      const active = location.hash.slice(1) || 'index';
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.pageId === active);
      });
    }

    function showPage(id) {
      const page = pages.find(p => p.id === id) || pages[0];
      location.hash = page.id;
      content.innerHTML = `<div class="badge">${page.kind}</div>` + page.html;
      syncActive();
    }

    search.addEventListener('input', () => renderNav(search.value));
    window.addEventListener('hashchange', () => showPage(location.hash.slice(1) || 'index'));
    renderNav();
    showPage(location.hash.slice(1) || 'index');
  </script>
