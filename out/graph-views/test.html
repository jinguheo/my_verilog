<!doctype html>
<html>
<head><meta charset="utf-8"><title>Canvas Test</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#eee}
#wrap{position:absolute;top:60px;left:0;right:0;bottom:0;background:#fff}
canvas{position:absolute;top:0;left:0}
</style>
</head>
<body>
<div style="background:#172033;color:#fff;height:60px;display:flex;align-items:center;padding:0 20px;font-family:Arial">
  Canvas Test — 원이 5개 보이면 정상
</div>
<div id="wrap">
  <canvas id="c"></canvas>
</div>
<script>
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");

function resize() {
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth  || window.innerWidth;
  const h = wrap.clientHeight || window.innerHeight - 60;
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width  = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(w, h);
}

function draw(w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#f0f0f0";
  ctx.fillRect(0, 0, w, h);

  // 5개 원
  const colors = ["#2563eb","#0f766e","#dc2626","#f97316","#7c3aed"];
  for (let i = 0; i < 5; i++) {
    const x = w * (0.15 + 0.7 * i / 4);
    const y = h * 0.5;
    ctx.beginPath();
    ctx.arc(x, y, 30, 0, Math.PI * 2);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "14px Arial";
    ctx.fillText("node " + (i+1), x - 25, y + 50);
  }
  ctx.fillStyle = "#333";
  ctx.font = "16px Arial";
  ctx.fillText(`canvas: ${canvas.width}x${canvas.height}  wrap: ${w}x${h}`, 20, 30);
}

window.addEventListener("resize", resize);
setTimeout(resize, 0);
</script>
</body>
</html>
