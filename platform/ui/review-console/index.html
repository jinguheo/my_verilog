<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTL Ontology Review Console</title>
  <style>
    :root {
      --ink: #18212f;
      --muted: #5e6b7c;
      --line: #d5dce5;
      --panel: #ffffff;
      --wash: #f4f7fa;
      --teal: #0f766e;
      --blue: #2563eb;
      --red: #b42318;
      --amber: #b7791f;
      --green: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--wash);
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 24px;
      background: #172033;
      color: white;
      border-bottom: 1px solid #0f172a;
    }
    h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: 0; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; }
    button, input, select { font: inherit; }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      background: #e8eef5;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }
    .tab {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      min-width: 112px;
    }
    .tab.active {
      background: var(--teal);
      border-color: var(--teal);
      color: white;
    }
    main { padding: 20px 24px 32px; }
    section { display: none; }
    section.active { display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .metric, .panel, .item, .module-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric { padding: 14px; min-height: 86px; }
    .metric strong { display: block; font-size: 26px; margin-top: 8px; }
    .panel { padding: 16px; margin-top: 14px; }
    .muted { color: var(--muted); font-size: 13px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px 160px;
      gap: 10px;
      margin-bottom: 12px;
    }
    .export-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding: 10px 14px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .export-bar .spacer { flex: 1; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      background: white;
      color: var(--ink);
    }
    .review-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .item { padding: 12px; transition: border-color 0.15s; }
    .item.decided-approved { border-color: #86efac; background: #f0fdf4; }
    .item.decided-rejected { border-color: #fca5a5; background: #fff5f5; }
    .item.decided-needs_evidence { border-color: #fde68a; background: #fffbeb; }
    .item-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
      margin-bottom: 8px;
    }
    .label {
      display: inline-block;
      border: 1px solid #c7d2fe;
      background: #eef2ff;
      color: #29347a;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      margin: 2px 3px 2px 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .state {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      white-space: nowrap;
    }
    .needs { background: #fff7ed; color: var(--amber); border: 1px solid #fed7aa; }
    .auto { background: #ecfdf3; color: var(--green); border: 1px solid #bbf7d0; }
    .rejected-state { background: #fff5f5; color: var(--red); border: 1px solid #fca5a5; }
    .item-auto-approved { border-left: 3px solid #22c55e; background: #f0fdf4; }
    .item-auto-approved .item-top h3 { color: #15803d; }
    .stat-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: white;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.12s, background 0.12s;
    }
    .stat-badge:hover { border-color: #94a3b8; }
    .stat-badge.active { border-color: var(--teal); background: #f0fdfa; }
    .stat-badge .cnt {
      font-weight: bold;
      font-size: 15px;
    }
    .cnt-all     { color: var(--ink); }
    .cnt-needs   { color: var(--amber); }
    .cnt-approved { color: var(--green); }
    .cnt-rejected { color: var(--red); }
    .path {
      font-family: Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .actions button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      padding: 7px 9px;
      cursor: pointer;
    }
    .actions button.active-approve {
      background: #dcfce7;
      border-color: #86efac;
      color: var(--green);
      font-weight: bold;
    }
    .actions button.active-reject {
      background: #fee2e2;
      border-color: #fca5a5;
      color: var(--red);
      font-weight: bold;
    }
    .actions button.active-needs_evidence {
      background: #fef9c3;
      border-color: #fde68a;
      color: var(--amber);
      font-weight: bold;
    }
    .approve { color: var(--green); }
    .reject { color: var(--red); }
    .btn-export {
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }
    .btn-export:disabled { background: #94a3b8; cursor: not-allowed; }
    .badge {
      display: inline-block;
      background: #2563eb;
      color: white;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: bold;
    }
    .decision-stats { font-size: 13px; color: var(--muted); }
    .decision-stats .ok { color: var(--green); font-weight: bold; }
    .decision-stats .no { color: var(--red); font-weight: bold; }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .module-card { padding: 12px; min-height: 160px; }
    .module-card h3 { overflow-wrap: anywhere; }
    .bars { display: grid; gap: 8px; margin-top: 12px; }
    .bar {
      display: grid;
      grid-template-columns: 170px 1fr 48px;
      gap: 10px;
      align-items: center;
    }
    .track { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: var(--blue); }
    .search-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .result {
      border-top: 1px solid var(--line);
      padding: 8px 0;
    }
    .graph-wrap {
      display: grid;
      grid-template-columns: minmax(300px, 1.2fr) minmax(260px, 0.8fr);
      gap: 16px;
      align-items: start;
    }
    svg {
      width: 100%;
      min-height: 520px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .legend { display: grid; gap: 8px; }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 7px;
    }
    @media (max-width: 980px) {
      .grid, .module-grid, .review-list, .search-row, .graph-wrap { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      header { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RTL Ontology Review Console</h1>
      <div class="muted" style="color:#cbd5e1">전체 RTL 데이터셋 · 온톨로지 레이블 리뷰 콘솔</div>
    </div>
    <div id="dataStatus" class="muted" style="color:#cbd5e1">loading data…</div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="review">Review Queue</button>
    <button class="tab" data-tab="search">Search Contrast</button>
    <button class="tab" data-tab="graph">Ontology Graph</button>
    <button class="tab" data-tab="modules">Modules</button>
  </nav>
  <main>
    <section id="overview" class="active">
      <div class="grid" id="metrics"></div>
      <div class="panel">
        <h2>Top Ontology Labels</h2>
        <div class="bars" id="labelBars"></div>
      </div>
    </section>

    <section id="review">
      <div class="export-bar">
        <span class="decision-stats" id="decisionStats">결정 없음</span>
        <span class="spacer"></span>
        <button class="btn-export" id="exportBtn" disabled onclick="exportDecisions()">
          Export Decisions (.jsonl)
        </button>
      </div>
      <div class="stat-badges" id="statBadges"></div>
      <div class="toolbar">
        <input id="reviewFilter" placeholder="module, label, path 필터">
        <select id="stateFilter">
          <option value="">전체 상태</option>
          <option value="needs_review">Needs review</option>
          <option value="auto_accept_candidate">Auto-accept candidate</option>
          <option value="rejected">Rejected</option>
        </select>
        <select id="projectFilter">
          <option value="">전체 프로젝트</option>
          <option value="opentitan">OpenTitan</option>
          <option value="ibex">Ibex</option>
        </select>
      </div>
      <div id="reviewCount" class="muted" style="margin-bottom:8px"></div>
      <div class="review-list" id="reviewList"></div>
    </section>

    <section id="search">
      <div id="searchRows"></div>
    </section>

    <section id="graph">
      <div class="graph-wrap">
        <svg id="graphSvg" viewBox="0 0 920 600" role="img" aria-label="Ontology graph"></svg>
        <div class="panel" style="margin-top:0">
          <h2>Graph Reading</h2>
          <p class="muted">모듈 노드는 추론된 레이블 및 인스턴스 엣지와 연결됩니다. 클러스터가 밀집된 영역은 온톨로지 레이블이 파서 심볼 이상의 검색 컨텍스트를 제공하는 곳입니다.</p>
          <div class="legend">
            <div><span class="dot" style="background:#2563eb"></span>module</div>
            <div><span class="dot" style="background:#0f766e"></span>label</div>
            <div><span class="dot" style="background:#94a3b8"></span>relationship</div>
          </div>
        </div>
      </div>
    </section>

    <section id="modules">
      <div class="toolbar">
        <input id="moduleFilter" placeholder="module, label, path 필터">
        <select id="moduleProjectFilter">
          <option value="">전체 프로젝트</option>
          <option value="opentitan">OpenTitan</option>
          <option value="ibex">Ibex</option>
        </select>
        <select id="moduleSort">
          <option value="name">이름순</option>
          <option value="ports">포트 수</option>
          <option value="instances">인스턴스 수</option>
        </select>
      </div>
      <div class="module-grid" id="moduleList"></div>
    </section>
  </main>

  <script>
    const DATA_URL = "../../../out/review_full/review_console_data.json";
    let data = null;

    // key → { row (original label row), decision (approved|rejected|needs_evidence) }
    const decisions = new Map();

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[ch]));
    }

    function rowKey(row, idx) {
      return `${row.project}|${row.module}|${row.label}|${idx}`;
    }

    function metric(label, value) {
      return `<div class="metric"><div class="muted">${esc(label)}</div><strong>${esc(value)}</strong></div>`;
    }

    function updateDecisionStats() {
      const approved = [...decisions.values()].filter(d => d.decision === "approved").length;
      const rejected = [...decisions.values()].filter(d => d.decision === "rejected").length;
      const evidence = [...decisions.values()].filter(d => d.decision === "needs_evidence").length;
      const total = decisions.size;
      const btn = document.getElementById("exportBtn");
      btn.disabled = total === 0;
      if (total > 0) {
        btn.textContent = `Export Decisions (.jsonl)  [${total}건]`;
      } else {
        btn.textContent = "Export Decisions (.jsonl)";
      }
      document.getElementById("decisionStats").innerHTML = total === 0
        ? "결정 없음 — Approve / Reject 후 Export 하세요"
        : `<span class="ok">✓ ${approved} approved</span>  ·  <span class="no">✗ ${rejected} rejected</span>  ·  <span style="color:var(--amber)">${evidence} needs evidence</span>  ·  총 ${total}건`;
    }

    window.setDecision = function(key, value, row) {
      if (decisions.has(key) && decisions.get(key).decision === value) {
        decisions.delete(key);
      } else {
        decisions.set(key, { row, decision: value });
      }
      updateDecisionStats();
      renderReview();
    };

    window.exportDecisions = function() {
      if (decisions.size === 0) return;
      const now = new Date();
      const ts = now.toISOString().replace(/[:.]/g, "-").slice(0, 19);
      const lines = [];
      for (const [, entry] of decisions) {
        const { row, decision } = entry;
        const reviewState = decision === "approved" ? "approved"
                          : decision === "rejected" ? "rejected"
                          : "needs_review";
        lines.push(JSON.stringify({
          project: row.project,
          entity_type: row.entity_type,
          target_name: row.module,
          path: row.path,
          label: row.label,
          group: row.group || "",
          source_confidence: row.confidence,
          auto_confidence: row.confidence,
          decision: decision === "approved" ? "auto_approved"
                  : decision === "rejected" ? "auto_rejected"
                  : "needs_review",
          review_state: reviewState,
          reviewed_by: "user",
          reviewed_at: now.toISOString(),
          evidence: row.evidence || [],
        }));
      }
      const blob = new Blob([lines.join("\n") + "\n"], { type: "application/x-ndjson" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `user_decisions_${ts}.jsonl`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    function renderOverview() {
      const s = data.summary;
      const approvalHtml = s.approval
        ? `<div class="panel" style="margin-top:14px">
             <h2>레이블 승인 현황</h2>
             <div class="bars" style="margin-top:8px">
               ${[
                 ["auto_approved", s.approval.auto_approved, "#15803d"],
                 ["needs_review", s.approval.needs_review, "#b7791f"],
                 ["auto_rejected", s.approval.auto_rejected, "#b42318"],
               ].map(([label, count, color]) => {
                 const max = Math.max(s.approval.auto_approved, s.approval.needs_review, s.approval.auto_rejected, 1);
                 return `<div class="bar">
                   <div>${esc(label)}</div>
                   <div class="track"><div class="fill" style="width:${Math.max(4, count/max*100)}%;background:${color}"></div></div>
                   <div class="muted">${count}</div>
                 </div>`;
               }).join("")}
             </div>
           </div>`
        : "";
      document.getElementById("metrics").innerHTML = [
        metric("전체 모듈", s.modules),
        metric("IP 블록", s.ip_blocks || 0),
        metric("포트", s.ports),
        metric("레이블 제안", s.label_proposals),
        metric("그래프 노드", s.graph_nodes),
        metric("그래프 엣지", s.graph_edges),
        metric("OpenTitan 모듈", s.projects.opentitan || 0),
        metric("Ibex 모듈", s.projects.ibex || 0),
      ].join("");
      document.getElementById("metrics").insertAdjacentHTML("afterend", approvalHtml);

      const max = Math.max(...s.top_labels.map(row => row[1]), 1);
      document.getElementById("labelBars").innerHTML = s.top_labels.map(([label, count]) => `
        <div class="bar">
          <div>${esc(label)}</div>
          <div class="track"><div class="fill" style="width:${Math.max(4, count / max * 100)}%"></div></div>
          <div class="muted">${count}</div>
        </div>
      `).join("");
    }

    function renderStatBadges() {
      if (!data) return;
      const counts = { "": 0, needs_review: 0, auto_accept_candidate: 0, rejected: 0 };
      data.labels.forEach(r => {
        counts[""]++;
        if (counts[r.review_state] !== undefined) counts[r.review_state]++;
      });
      const active = document.getElementById("stateFilter").value;
      document.getElementById("statBadges").innerHTML = [
        { val: "",                     label: "전체",           cls: "cnt-all",      icon: "◈" },
        { val: "needs_review",         label: "Needs Review",   cls: "cnt-needs",    icon: "⚑" },
        { val: "auto_accept_candidate",label: "Auto Approved",  cls: "cnt-approved", icon: "✓" },
        { val: "rejected",             label: "Auto Rejected",  cls: "cnt-rejected", icon: "✗" },
      ].map(({ val, label, cls, icon }) => `
        <button class="stat-badge${active === val ? ' active' : ''}" onclick="setStateFilter('${val}')">
          <span class="${cls}">${icon}</span>
          <span>${label}</span>
          <span class="cnt ${cls}">${counts[val] ?? 0}</span>
        </button>
      `).join("");
    }

    window.setStateFilter = function(val) {
      document.getElementById("stateFilter").value = val;
      renderStatBadges();
      renderReview();
    };

    function renderReview() {
      const q = document.getElementById("reviewFilter").value.toLowerCase();
      const state = document.getElementById("stateFilter").value;
      const project = document.getElementById("projectFilter").value;

      // 전역 인덱스 기준 key를 유지하기 위해 원본 index를 함께 보존
      const filtered = [];
      data.labels.forEach((row, globalIdx) => {
        const hay = [row.module, row.label, row.path, row.project].join(" ").toLowerCase();
        if ((!q || hay.includes(q))
          && (!state || row.review_state === state)
          && (!project || row.project === project)) {
          filtered.push({ row, globalIdx });
        }
      });

      const countEl = document.getElementById("reviewCount");
      countEl.textContent = `${filtered.length}건 표시`;

      document.getElementById("reviewList").innerHTML = filtered.map(({ row, globalIdx }) => {
        const key = rowKey(row, globalIdx);
        const entry = decisions.get(key);
        const decision = entry ? entry.decision : "";

        const stateClass = row.review_state === "needs_review"         ? "needs"
                         : row.review_state === "auto_accept_candidate" ? "auto"
                         : "rejected-state";
        const stateLabel = row.review_state === "auto_accept_candidate" ? "auto approved"
                         : row.review_state;

        const autoApprovedClass = row.review_state === "auto_accept_candidate" ? "item-auto-approved" : "";
        const decidedClass = decision ? `decided-${decision}` : "";

        return `
          <article class="item ${autoApprovedClass} ${decidedClass}">
            <div class="item-top">
              <div>
                <h3>${esc(row.module)}</h3>
                <span class="label">${esc(row.label)}</span>
                ${row.group ? `<span class="label" style="background:#f1f5f9;color:#475569;border-color:#cbd5e1">${esc(row.group)}</span>` : ""}
              </div>
              <span class="state ${stateClass}">${esc(stateLabel)}</span>
            </div>
            <div class="muted">confidence ${Math.round((row.confidence || 0) * 100)}% · ${esc(row.project)}</div>
            <div class="path">${esc(row.path)}</div>
            <div class="actions">
              <button class="approve${decision === 'approved' ? ' active-approve' : ''}"
                onclick="setDecision('${esc(key)}', 'approved', ${JSON.stringify(row).replace(/"/g, '&quot;')})">
                ✓ Approve
              </button>
              <button class="reject${decision === 'rejected' ? ' active-reject' : ''}"
                onclick="setDecision('${esc(key)}', 'rejected', ${JSON.stringify(row).replace(/"/g, '&quot;')})">
                ✗ Reject
              </button>
              <button class="${decision === 'needs_evidence' ? 'active-needs_evidence' : ''}"
                onclick="setDecision('${esc(key)}', 'needs_evidence', ${JSON.stringify(row).replace(/"/g, '&quot;')})">
                ? More evidence
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderSearch() {
      document.getElementById("searchRows").innerHTML = data.searchComparison.map(row => `
        <div class="panel">
          <h2>${esc(row.query)}</h2>
          <div class="search-row">
            <div>
              <h3>Parser + LSP 단순 query</h3>
              <p class="muted">${esc(row.difference?.parser_lsp || "")}</p>
              ${row.parser_lsp.map(result => `
                <div class="result">
                  <strong>${esc(result.name)}</strong>
                  <div class="muted">${esc(result.project)} · score ${esc(result.score)} · ${esc(result.why)}</div>
                </div>
              `).join("") || "<div class='muted'>No direct symbol match</div>"}
            </div>
            <div>
              <h3>Ontology / Knowledge DB search</h3>
              <p class="muted">${esc(row.difference?.ontology_db || "")}</p>
              ${row.ontology_db.map(result => `
                <div class="result">
                  <strong>${esc(result.name)}</strong>
                  <div class="muted">${esc(result.project)} · score ${esc(result.score)} · ${esc(result.why)}</div>
                  <div>${(result.labels || []).map(label => `<span class="label">${esc(label)}</span>`).join("")}</div>
                </div>
              `).join("") || "<div class='muted'>No ontology match</div>"}
            </div>
          </div>
        </div>
      `).join("");
    }

    function renderModules() {
      const q = document.getElementById("moduleFilter").value.toLowerCase();
      const project = document.getElementById("moduleProjectFilter").value;
      const sort = document.getElementById("moduleSort").value;
      const rows = data.modules.filter(module => {
        const hay = [module.name, module.path, module.project, ...(module.labels || [])].join(" ").toLowerCase();
        return (!q || hay.includes(q)) && (!project || module.project === project);
      }).sort((a, b) => {
        if (sort === "ports") return (b.ports?.length || 0) - (a.ports?.length || 0);
        if (sort === "instances") return (b.instances?.length || 0) - (a.instances?.length || 0);
        return a.name.localeCompare(b.name);
      }).slice(0, 90);
      document.getElementById("moduleList").innerHTML = rows.map(module => `
        <article class="module-card">
          <h3>${esc(module.name)}</h3>
          <div class="muted">${esc(module.project)} · ports ${module.ports?.length || 0} · instances ${module.instances?.length || 0}</div>
          <div>${(module.labels || []).map(label => `<span class="label">${esc(label)}</span>`).join("")}</div>
          <div class="path">${esc(module.path)}</div>
        </article>
      `).join("");
    }

    function renderGraph() {
      const svg = document.getElementById("graphSvg");
      const nodes = data.graph.nodes.slice(0, 90);
      const nodeIds = new Set(nodes.map(n => n.id));
      const edges = data.graph.edges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target)).slice(0, 160);
      const width = 920, height = 600, cx = width / 2, cy = height / 2;
      const labelNodes = nodes.filter(n => n.type === "label");
      const moduleNodes = nodes.filter(n => n.type === "module");
      const pos = new Map();
      labelNodes.forEach((node, idx) => {
        const angle = (idx / Math.max(labelNodes.length, 1)) * Math.PI * 2;
        pos.set(node.id, { x: cx + Math.cos(angle) * 230, y: cy + Math.sin(angle) * 220 });
      });
      moduleNodes.forEach((node, idx) => {
        const angle = (idx / Math.max(moduleNodes.length, 1)) * Math.PI * 2;
        const radius = 70 + (idx % 4) * 35;
        pos.set(node.id, { x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius });
      });
      const lines = edges.map(edge => {
        const a = pos.get(edge.source), b = pos.get(edge.target);
        if (!a || !b) return "";
        return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#94a3b8" stroke-width="1" opacity="0.38"/>`;
      }).join("");
      const circles = nodes.map(node => {
        const p = pos.get(node.id);
        if (!p) return "";
        const color = node.type === "label" ? "#0f766e" : "#2563eb";
        const r = node.type === "label" ? 7 : 5;
        const text = node.type === "label"
          ? `<text x="${p.x + 9}" y="${p.y + 4}" font-size="11" fill="#334155">${esc(node.label)}</text>`
          : "";
        return `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${color}"><title>${esc(node.label)}</title></circle>${text}`;
      }).join("");
      svg.innerHTML = lines + circles;
    }

    function activate(tab) {
      document.querySelectorAll(".tab").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));
      document.querySelectorAll("section").forEach(section => section.classList.toggle("active", section.id === tab));
      if (tab === "graph") renderGraph();
    }

    document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => activate(btn.dataset.tab)));
    ["reviewFilter", "projectFilter"].forEach(id =>
      document.getElementById(id).addEventListener("input", renderReview));
    document.getElementById("stateFilter").addEventListener("change", () => {
      renderStatBadges();
      renderReview();
    });
    ["moduleFilter", "moduleProjectFilter", "moduleSort"].forEach(id =>
      document.getElementById(id).addEventListener("input", renderModules));

    fetch(DATA_URL)
      .then(response => {
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.json();
      })
      .then(payload => {
        data = payload;
        document.getElementById("dataStatus").textContent =
          `전체 데이터 로드 완료 · 모듈 ${payload.summary.modules}개 · 레이블 제안 ${payload.summary.label_proposals}개`;
        renderOverview();
        renderStatBadges();
        renderReview();
        renderSearch();
        renderModules();
      })
      .catch(error => {
        document.getElementById("dataStatus").textContent = `데이터 로드 실패: ${error.message}`;
      });
  </script>
</body>
</html>
